# Next.js on Netlify. This site was first created via Netlify Drop, which
# skips auto framework detection — so we must declare the OpenNext
# adapter explicitly. Without it, `next build` succeeds but Netlify
# publishes `.next` as static files and every route 404s.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_* values are intentionally inlined into the client
  # bundle. If those env vars are marked "Contains secret values" in
  # the Netlify UI, secret scanning fails the deploy with
  # "Exposed secrets detected". Omit them from the scan; keep scanning
  # for real secrets (service role, encryption key, Meta secret).
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_APP_LOCALE"
  # Turbopack writes env values into local `.sst` cache files under
  # `.next/cache` (copied to `.netlify/.next/cache` by the runtime).
  # Those files are never published, but secret scanning still fails
  # when it finds ENCRYPTION_KEY / META_APP_SECRET there.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache,.netlify/.next/cache"
